<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我們的旅行</title>
<meta name="description" content="旅行計畫目錄：宿霧薄荷島、新竹兩天一夜。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;800&family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: 旅行護照目錄 — 標題＋一列列行程票卡（日期戳記在左） */
:root{
  --bg:#f1f3f0; --paper:#fff; --ink:#1b2722; --muted:#5d6b64; --line:#d6ddd8; --accent:#d4901a;
  --t1:#0f5b5f; --t2:#b4462b;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1513; --paper:#161f1c; --ink:#e3ebe6; --muted:#97a69f; --line:#2a3833; --accent:#eaa93a;
  --t1:#5fc2c4; --t2:#f0805f; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:820px;margin:0 auto}
header{padding-block:56px 28px;display:grid;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-size:clamp(32px,6vw,52px);font-weight:800;margin:0;line-height:1.2}
.lede{margin:0;color:var(--muted)}
.list{display:grid;gap:14px}
a.trip{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:18px;align-items:center;text-decoration:none;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;position:relative;overflow:hidden;transition:border-color .2s,transform .2s}
a.trip:hover{border-color:var(--c);transform:translateY(-2px)}
a.trip:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.stamp{border:2px solid var(--c);color:var(--c);border-radius:10px;padding:8px 6px;text-align:center;transform:rotate(-4deg);font-family:var(--f-mono);line-height:1.25}
.stamp b{display:block;font-family:var(--f-display);font-size:22px}
.stamp span{display:block;font-size:11px;letter-spacing:.08em}
.date{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.count{font-family:var(--f-body);font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:999px;padding:0 8px;margin-left:6px;white-space:nowrap}
.info{min-width:0;display:grid;gap:4px}
.info h2{font-family:var(--f-display);font-size:22px;margin:0;color:var(--c)}
.info p{margin:0;color:var(--muted);font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tags span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.go{font-size:22px;color:var(--c)}
@media (max-width:560px){a.trip{grid-template-columns:84px minmax(0,1fr)}.go{display:none}.stamp b{font-size:18px}}
footer{margin-top:28px;color:var(--muted);font-size:12px}
@media (prefers-reduced-motion:reduce){a.trip{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">Travel Plans</div>
  <h1>我們的旅行</h1>
  <p class="lede">每一趟旅行的行程、路線圖與注意事項。點進去看細節。</p>
</header>
<div class="list">
  <a class="trip" href="20270126-20270201-cebu/" style="--c:var(--t1)" data-start="2027-01-26" data-end="2027-02-01">
    <div class="stamp"><b>01.26</b><span>– 02.01</span><span>2027 · 7D6N</span></div>
    <div class="info"><span class="date">2027/01/26（二）→ 2027/02/01（一）・7 天 6 夜 <b class="count" hidden></b></span><h2>宿霧・薄荷島</h2><p>跳島浮潛、歐斯陸鯨鯊、卡瓦山瀑布、巧克力山與眼鏡猴，家庭七天六夜。</p>
      <div class="tags"><span>菲律賓</span><span>家庭</span><span>互動路線圖</span></div></div>
    <span class="go" aria-hidden="true">→</span>
  </a>
  <a class="trip" href="undated-hsinchu/" style="--c:var(--t2)">
    <div class="stamp"><b>未定</b><span>2D1N</span><span>全年可去</span></div>
    <div class="info"><span class="date">日期未定・兩天一夜</span><h2>新竹出發兩天一夜</h2><p>客家老街、山林部落、海線單車、苗栗溫泉草莓，四條大眾運輸路線與每月推薦。</p>
      <div class="tags"><span>台灣</span><span>情侶</span><span>不開車</span></div></div>
    <span class="go" aria-hidden="true">→</span>
  </a>
</div>
<footer>行程內的價格、班次與季節資訊為大約值，出發前請再確認。</footer>
<script>
(function(){
  document.querySelectorAll('[data-start]').forEach(function(a){
    var s=new Date(a.dataset.start+'T00:00:00+08:00'),e=new Date(a.dataset.end+'T23:59:59+08:00'),n=new Date();
    var d=Math.ceil((s-n)/864e5),t=a.querySelector('.count');if(!t)return;
    t.textContent=n>e?'已結束':n>=s?'旅行中':'還有 '+d+' 天';t.hidden=false;
  });
})();
</script>
</div>
</body>
</html>
